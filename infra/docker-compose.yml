name: api6-ollama

services:
  postgres:
    image: postgres:17-alpine
    container_name: api6-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: api6
      POSTGRES_USER: api6_admin
      POSTGRES_PASSWORD: <random-password>
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mongodb:
    image: mongo:8.2
    container_name: api6-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: api6
      MONGO_INITDB_ROOT_USERNAME: api6_admin
      MONGO_INITDB_ROOT_PASSWORD: <random-password>
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  postgres_data:
  mongo_data:
  ollama_data:
